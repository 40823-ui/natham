<h1>กระบี่</h1>

<p>
กระบี่เป็นจังหวัดทางภาคใต้ที่มีธรรมชาติสวยงาม
มีทั้งทะเล เกาะ และภูเขาหินปูน
สถานที่ท่องเที่ยวที่มีชื่อเสียง ได้แก่ อ่าวนาง
เกาะพีพี และทะเลแหวก
</p>
